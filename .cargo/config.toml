[build]
# Sparse registry protocol — much faster index updates (default on 1.70+, set explicitly).
# Set CARGO_TARGET_DIR in your shell to share build artifacts across projects.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
# Prefer mold or lld when installed (`sudo apt install mold` / `lld`);
# plain rustflags keep the build working on systems that only ship
# the default GNU linker.
rustflags = []

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = []

[registries.crates-io]
protocol = "sparse"
